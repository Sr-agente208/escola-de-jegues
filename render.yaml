# Render Blueprint — publica o site + API + e-mail num único serviço grátis
# Deploy: render.com → New → Blueprint → selecionar este repositório → Apply
services:
  - type: web
    name: escola-de-jegues
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Preencha estes 4 no painel do Render após criar o Blueprint (SECRETS — nunca no Git):
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        sync: false
      # Render gera um JWT_SECRET forte sozinho:
      - key: JWT_SECRET
        generateValue: true
      # PostgreSQL/Supabase: configure somente no painel, não no repositório.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Chave independente com pelo menos 32 caracteres; também informada no menu.
      - key: DB_ADMIN_SECRET
        sync: false
