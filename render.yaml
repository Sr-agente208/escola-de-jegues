# Render Blueprint — publica o site + API + e-mail num único serviço grátis
# Deploy: render.com → New → Blueprint → selecionar este repositório → Apply
services:
  - type: web
    name: escola-de-jegues
    runtime: python
    plan: free
    startCommand: python3 backend/server.py
    healthCheckPath: /api/health
    envVars:
      # Preencha estes 4 no painel do Render após criar o Blueprint (SECRETS — nunca no Git):
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        sync: false
      # Habilitar somente depois de configurar todas as variáveis no painel.
      - key: MEMBERS_MODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      # Render gera um JWT_SECRET forte sozinho:
      - key: JWT_SECRET
        generateValue: true
