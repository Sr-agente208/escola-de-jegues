<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administração escolar</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Banco de notas</h1><p>Painel administrativo ligado ao Supabase. Use sua conta do Supabase Auth.</p>
<form id="login"><label>E-mail <input name="email" type="email" required autocomplete="username"></label><label>Senha <input name="senha" type="password" required autocomplete="current-password"></label><button>Entrar</button></form>
<section id="painel" hidden><button id="sair" type="button">Sair</button><h2>Monitoramento</h2><div id="totais"></div><h2>Últimas notas</h2><p>Altere o valor e clique em Salvar. Cadastros ainda devem ser feitos no painel do Supabase.</p><div id="notas"></div></section><p id="status" role="status"></p></main><script src="app.js"></script></body></html>
